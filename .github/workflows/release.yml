name: release

on:
  push:
    tags: ['v*']

# softprops/action-gh-release + gh release need write access.
permissions:
  contents: write

env:
  # Pin the runtime-lib versions so releases are reproducible. Bump in lockstep.
  ORT_VERSION: '1.28.0'
  # bblanchon/pdfium-binaries publishes per chromium-version release per OS/arch.
  PDFIUM_RELEASE: 'chromium/7988'

# A self-contained install bundle per platform:
#   bitvanes           — the CLI (dashboard embedded)
#   bitvanes-nerd      — the Tier-2 NER sidecar
#   lib/                — libonnxruntime + libpdfium (auto-discovered by the
#                        binaries, so no PATH/env setup for the user)
#   models/             — the bundled Int8 NER model + tokenizer
# Both binaries find their runtime lib + the model next to the executable, so
# extracting the archive and running `./bitvanes` (or `bitvanes daemon`) and
# `./bitvanes-nerd` "just works".

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: bitvanes-x86_64-linux.tar.gz
            ort-asset: onnxruntime-linux-x64-1.28.0.tgz
            ort-lib: lib/libonnxruntime.so
            ort-lib-out: libonnxruntime.so
            pdfium-asset: pdfium-linux-x64.tgz
            pdfium-lib: lib/libpdfium.so
            pdfium-lib-out: libpdfium.so
          - label: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: bitvanes-aarch64-linux.tar.gz
            ort-asset: onnxruntime-linux-aarch64-1.28.0.tgz
            ort-lib: lib/libonnxruntime.so
            ort-lib-out: libonnxruntime.so
            pdfium-asset: pdfium-linux-arm64.tgz
            pdfium-lib: lib/libpdfium.so
            pdfium-lib-out: libpdfium.so
          - label: macos-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            archive: bitvanes-aarch64-macos.tar.gz
            ort-asset: onnxruntime-osx-arm64-1.28.0.tgz
            ort-lib: lib/libonnxruntime.dylib
            ort-lib-out: libonnxruntime.dylib
            pdfium-asset: pdfium-mac-arm64.tgz
            pdfium-lib: lib/libpdfium.dylib
            pdfium-lib-out: libpdfium.dylib
          - label: macos-x86_64
            runs-on: macos-13
            target: x86_64-apple-darwin
            archive: bitvanes-x86_64-macos.tar.gz
            ort-asset: onnxruntime-osx-x64-1.28.0.tgz
            ort-lib: lib/libonnxruntime.dylib
            ort-lib-out: libonnxruntime.dylib
            pdfium-asset: pdfium-mac-x64.tgz
            pdfium-lib: lib/libpdfium.dylib
            pdfium-lib-out: libpdfium.dylib
          - label: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            archive: bitvanes-x86_64-windows.zip
            ort-asset: onnxruntime-win-x64-1.28.0.zip
            ort-lib: lib/onnxruntime.dll
            ort-lib-out: onnxruntime.dll
            pdfium-asset: pdfium-win-x64.tgz
            pdfium-lib: bin/pdfium.dll
            pdfium-lib-out: pdfium.dll

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      # 1. Build the web dashboard first — the CLI's `dashboard` feature embeds it.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      # 2. Rust toolchain + both binaries (release). The CLI embeds the
      #    dashboard; nerd pulls ort + tokenizers (load-dynamic — clean build).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli -> cli/target
            nerd -> nerd/target
      - name: Build bitvanes (CLI + dashboard)
        working-directory: cli
        run: cargo build --release --features dashboard --target ${{ matrix.target }}
      - name: Build bitvanes-nerd (sidecar + model)
        working-directory: nerd
        run: cargo build --release --features model --target ${{ matrix.target }}

      # 3. Assemble the bundle layout the binaries auto-discover.
      - name: Stage bundle
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundle"
          mkdir -p "$STAGE/lib" "$STAGE/models"
          cp "cli/target/${{ matrix.target }}/release/bitvanes${{ matrix.label == 'windows-x86_64' && '.exe' || '' }}" "$STAGE/"
          cp "nerd/target/${{ matrix.target }}/release/bitvanes-nerd${{ matrix.label == 'windows-x86_64' && '.exe' || '' }}" "$STAGE/"
          # NER model + tokenizer (pinned + SHA256-verified by the script).
          nerd/scripts/fetch-model.sh "$STAGE/models"

      # 4. libonnxruntime (microsoft/onnxruntime) — for the NER sidecar.
      - name: Fetch libonnxruntime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${{ matrix.ort-asset }}" -o ort.pkg
          case "${{ matrix.ort-asset }}" in
            *.tgz) tar xzf ort.pkg ;;
            *.zip) unzip -o ort.pkg ;;
          esac
          find . -path "*${{ matrix.ort-lib }}"
          cp "$(find . -path "*${{ matrix.ort-lib }}" | head -1)" "$STAGE/lib/${{ matrix.ort-lib-out }}"

      # 5. libpdfium (bblanchon/pdfium-binaries) — for destructive PDF redaction.
      - name: Fetch libpdfium
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundle"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/${{ matrix.pdfium-asset }}" -o pdfium.pkg
          tar xzf pdfium.pkg
          cp "${{ matrix.pdfium-lib }}" "$STAGE/lib/${{ matrix.pdfium-lib-out }}"

      # 6. README pointing users at the docs.
      - name: Stage bundle README
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/bundle"
          cat > "$STAGE/README.txt" <<'EOF'
          BitVanes — extract this folder anywhere and run:
            ./bitvanes --help            # the CLI (scrub / filter / daemon / tui)
            ./bitvanes-nerd --help       # the Tier-2 NER sidecar (run for names)
          Everything BitVanes needs (NER model + runtimes) is in this folder;
          no PATH or env setup. See https://bitvanes.com or the --help output.
          EOF

      # 7. Archive.
      - name: Archive (unix)
        if: matrix.label != 'windows-x86_64'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" -C bundle .
      - name: Archive (windows)
        if: matrix.label == 'windows-x86_64'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP\bundle\*" -DestinationPath "$env:GITHUB_WORKSPACE\${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    name: publish to BitVanes/releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten assets
        run: find assets -type f \( -name 'bitvanes-*.tar.gz' -o -name 'bitvanes-*.zip' \) -exec mv {} . \;
      # Publish to the PUBLIC releases repo (source stays private). Uses a PAT
      # (RELEASES_PAT secret) — the default GITHUB_TOKEN can't write cross-repo.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo BitVanes/releases \
            --target main \
            --title "BitVanes $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            bitvanes-*.tar.gz bitvanes-*.zip

  # Auto-bump the Homebrew tap (BitVanes/homebrew-bitvanes) so `brew upgrade
  # bitvanes` tracks every release. Regenerates Formula/bitvanes.rb with the
  # new version + a per-arch sha256 (mac/linux × arm/intel), then commits via
  # the PAT. Windows isn't Homebrew, so its asset is intentionally absent.
  brew:
    name: bump homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download the just-published archives + checksum them
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          for asset in bitvanes-aarch64-macos bitvanes-x86_64-macos bitvanes-aarch64-linux bitvanes-x86_64-linux; do
            gh release download "$GITHUB_REF_NAME" --repo BitVanes/releases --pattern "${asset}.tar.gz" --clobber
          done
          echo "MAC_ARM=$(sha256sum bitvanes-aarch64-macos.tar.gz | cut -d' ' -f1)"   >> "$GITHUB_ENV"
          echo "MAC_INTEL=$(sha256sum bitvanes-x86_64-macos.tar.gz | cut -d' ' -f1)"   >> "$GITHUB_ENV"
          echo "LINUX_ARM=$(sha256sum bitvanes-aarch64-linux.tar.gz | cut -d' ' -f1)"  >> "$GITHUB_ENV"
          echo "LINUX_INTEL=$(sha256sum bitvanes-x86_64-linux.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Regenerate Formula/bitvanes.rb
        env:
          # version is the tag minus the leading 'v' (e.g. v1.1.0 -> 1.1.0)
          VER: ${{ github.ref_name }}
        run: |
          VER_NO_V="${VER#v}"
          BASE="https://github.com/BitVanes/releases/releases/download/${VER}"
          mkdir -p Formula
          cat > Formula/bitvanes.rb <<EOF
          # Auto-generated by the BitVanes release workflow — do not edit by hand.
          class Bitvanes < Formula
            desc "Zero-trust PII purification and stream-filtering engine"
            homepage "https://bitvanes.com"
            version "${VER_NO_V}"
            license :cannot_represent

            on_macos do
              on_arm do
                url "${BASE}/bitvanes-aarch64-macos.tar.gz"
                sha256 "${{ env.MAC_ARM }}"
              end
              on_intel do
                url "${BASE}/bitvanes-x86_64-macos.tar.gz"
                sha256 "${{ env.MAC_INTEL }}"
              end
            end
            on_linux do
              on_arm do
                url "${BASE}/bitvanes-aarch64-linux.tar.gz"
                sha256 "${{ env.LINUX_ARM }}"
              end
              on_intel do
                url "${BASE}/bitvanes-x86_64-linux.tar.gz"
                sha256 "${{ env.LINUX_INTEL }}"
              end
            end

            def install
              # Self-contained bundle: binaries in bin/, runtimes + model alongside
              # (lib/, models/) where the binaries auto-discover them.
              lib.install Dir["lib/*"] if (buildpath/"lib").exist?
              (prefix/"models").install Dir["models/*"] if (buildpath/"models").exist?
              bin.install "bitvanes"
              bin.install "bitvanes-nerd"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/bitvanes --version")
            end
          end
          EOF

      - name: Push to BitVanes/homebrew-bitvanes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -euo pipefail
          REPO="BitVanes/homebrew-bitvanes"
          # Use the GitHub API to update the single file atomically (no clone needed).
          SHA=$(gh api "repos/${REPO}/contents/Formula/bitvanes.rb" --jq '.sha')
          CONTENT=$(base64 -w0 < Formula/bitvanes.rb)
          gh api -X PUT "repos/${REPO}/contents/Formula/bitvanes.rb" \
            -f message="brew: bump bitvanes to ${GITHUB_REF_NAME}" \
            -f content="${CONTENT}" \
            -f sha="${SHA}" \
            -f branch="main" \
            --silent

