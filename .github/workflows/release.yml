name: release

on:
  push:
    tags: ['v*']

# softprops/action-gh-release needs write access to create the release.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os-label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            os-label: linux
            target: x86_64-unknown-linux-gnu
            artifact: bitvanes-x86_64-linux.tar.gz
          - runs-on: macos-latest
            os-label: macos-arm64
            target: aarch64-apple-darwin
            artifact: bitvanes-aarch64-macos.tar.gz
          - runs-on: macos-latest
            os-label: macos-intel
            target: x86_64-apple-darwin
            artifact: bitvanes-x86_64-macos.tar.gz
          - runs-on: windows-latest
            os-label: windows
            target: x86_64-pc-windows-msvc
            artifact: bitvanes-x86_64-windows.zip
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      # Build the dashboard bundle first — the `dashboard` feature embeds it.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'cli -> cli/target'

      - name: Build bitvanes (release + dashboard)
        working-directory: cli
        run: cargo build --release --features dashboard --target ${{ matrix.target }}

      - name: Archive (unix)
        if: matrix.os-label != 'windows'
        run: tar czf "${{ matrix.artifact }}" -C cli/target/${{ matrix.target }}/release bitvanes

      - name: Archive (windows)
        if: matrix.os-label == 'windows'
        shell: pwsh
        run: Compress-Archive -Path cli/target/${{ matrix.target }}/release/bitvanes.exe -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten assets
        run: find assets -type f \( -name 'bitvanes-*.tar.gz' -o -name 'bitvanes-*.zip' \) -exec mv {} . \;
      # Publish to the PUBLIC releases repo (source stays private). Uses a PAT
      # (RELEASES_PAT secret) — the default GITHUB_TOKEN can't write cross-repo.
      # `gh release create` with an explicit --target avoids the "invalid
      # target_commitish" error that softprops hit (the tag doesn't exist in
      # the releases repo, so we anchor it on its main branch).
      - name: Publish to BitVanes/releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo BitVanes/releases \
            --target main \
            --title "BitVanes $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            bitvanes-*.tar.gz bitvanes-*.zip
