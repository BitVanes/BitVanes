name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-grammars.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run compile
      - name: Package vsix
        run: npx vsce package --out bitvanes-${{ github.ref_name }}.vsix
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bitvanes-${{ github.ref_name }}.vsix
          generate_release_notes: true
