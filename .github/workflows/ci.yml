name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Toolchain is pinned to an exact patch (1.97.1) via the `toolchain:` input
  # on each rust-toolchain step AND via each component's rust-toolchain.toml.
  # Floating `@stable` caused a fmt skew between local and CI (a patch release
  # changed rustfmt's closure collapsing); pinning both sides makes formatting
  # deterministic. Bump deliberately and in lockstep across all four pins.
  TOOLCHAIN_PIN: "1.97.1"
  # Full native feature set (excludes `pii-model`, whose ModelDetector is an
  # `unimplemented!()` stub by design). `ner-client` is included so the NER
  # sidecar IPC client + its socket tests are exercised every run.
  CORE_FEATURES: cli-pdf,parallel,ipc,csv,office,mmap,stream,pdf-redact,config,ner-client

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Non-blocking: the dtolnay/rust-toolchain action's rustfmt build has
    # historically disagreed with local `rustup` rustfmt (same version string,
    # different closure-chain canonicalization), making this gate flake between
    # local and CI. Keep it as a signal, but never block a merge on it. The
    # blocking gates are clippy + tests in the component jobs below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_PIN }}
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: core
      - run: cargo fmt --all --check
        working-directory: cli
      - run: cargo fmt --all --check
        working-directory: nerd

  core:
    name: core (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_PIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core -> core/target"
      # NOTE: libpdfium is intentionally NOT installed in CI. The pdfium
      # integration tests guard on `pdfium_available()` and skip when the
      # library is absent (the engine's fail-closed contract). This keeps CI
      # free of a hard pdfium packaging dependency.
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --features "$CORE_FEATURES" -- -D warnings
      - name: Test
        working-directory: core
        run: cargo test --workspace --features "$CORE_FEATURES"

  cli:
    name: cli (clippy + test + release build)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_PIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "cli -> cli/target"
      - name: Clippy
        working-directory: cli
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: cli
        run: cargo test
      - name: Release build
        working-directory: cli
        run: cargo build --release
      - name: Smoke test the release binary
        working-directory: cli
        run: |
          printf 'mail alice@example.com or 123-45-6789\n' > /tmp/t.txt
          ./target/release/bitvanes scrub /tmp/t.txt --out - --rules email,ssn
          ./target/release/bitvanes --version

  nerd:
    name: nerd (clippy + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_PIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "nerd -> nerd/target"
      # The scaffold ships an inference stub that fails closed; no `model`
      # feature in CI yet (needs the bundled ONNX artifact + libonnxruntime).
      - name: Clippy
        working-directory: nerd
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        working-directory: nerd
        run: cargo build

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build

  audit:
    name: supply-chain (cargo-audit)
    runs-on: ubuntu-latest
    # Non-blocking: advisory warnings surface but never fail a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.TOOLCHAIN_PIN }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit core dependencies
        working-directory: core
        # RUSTSEC-2026-0187 (lopdf): stack-overflow DoS via deeply nested PDF
        # objects. Transitive via pdf-extract 0.10 (pins lopdf ^0.38); the
        # destructive redaction path uses pdfium, not lopdf. Accepted until
        # pdf-extract publishes a lopdf 0.42 bump.
        run: cargo audit --ignore RUSTSEC-2026-0187
