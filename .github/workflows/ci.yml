name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Full native feature set (excludes `pii-model`, whose ModelDetector is an
  # `unimplemented!()` stub by design).
  CORE_FEATURES: cli-pdf,parallel,ipc,csv,office,mmap,stream,pdf-redact,config

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: core
      - run: cargo fmt --all --check
        working-directory: cli

  core:
    name: core (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core -> core/target"
      # libpdfium is needed to exercise the destructive PDF redaction tests.
      - name: Install libpdfium (runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpdfium7 || sudo apt-get install -y pdfium
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --features "$CORE_FEATURES" -- -D warnings
      - name: Test
        working-directory: core
        run: cargo test --workspace --features "$CORE_FEATURES"

  cli:
    name: cli (clippy + test + release build)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "cli -> cli/target"
      - name: Install libpdfium (runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpdfium7 || sudo apt-get install -y pdfium
      - name: Clippy
        working-directory: cli
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: cli
        run: cargo test
      - name: Release build (dashboard feature)
        working-directory: cli
        run: cargo build --release --features dashboard
      - name: Smoke test the release binary
        working-directory: cli
        run: |
          printf 'mail alice@example.com or 123-45-6789\n' > /tmp/t.txt
          ./target/release/bitvanes scrub /tmp/t.txt --out - --rules email,ssn
          ./target/release/bitvanes --version

  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build

  audit:
    name: supply-chain (cargo-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: core
