[package]
name = "bitvanes-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
readme.workspace = true
description = "Zero-trust ETL engine: parse, scrub, tokenize, chunk, and emit Apache Arrow columnar memory."

[lib]
crate-type = ["rlib"]

# ---------------------------------------------------------------------------
# Feature flags. See the phased build plan for the rationale behind each.
# ---------------------------------------------------------------------------
[features]
default = []

# Arrow IPC stream output (StreamWriter). Native-only.
ipc = ["arrow/ipc"]

# Arrow CSV output. Native-only.
csv = ["arrow/csv"]

# Native PDF text extraction via `pdf-extract`. Native-only — the browser
# extracts text via PDF.js in JavaScript before reaching the engine, so the
# wasm build never enables this.
cli-pdf = ["dep:pdf-extract"]

# On-device embedding generation via ONNX Runtime. Native-only.
# Implies `parallel` for batch-wise embedding inference.
embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray", "parallel"]

# Rayon-based parallel batch processing + parallel intra-doc regex sweep.
# Native-only.
parallel = ["dep:rayon"]

# Office document parsing: DOCX, PPTX, XLSX, EPUB, RTF. Native-only —
# the browser delegates binary formats to JS libraries (mammoth.js, etc.).
office = ["dep:zip", "dep:quick-xml", "dep:calamine", "dep:rtf-parser"]

# Memory-mapped file I/O for large files (>1 MB). Native-only.
mmap = ["dep:memmap2"]

# Tier-2 ML-based PII detection (ONNX NER model). Stub only — the trait
# and ModelDetector type are always available, but the impl is gated here
# until the ONNX integration lands. Native-only.
pii-model = []

# NOTE on `embed-vocab`: BPE vocab is embedded at compile time *unconditionally*
# by `tiktoken-rs` (which `include_str!`s its assets and contains no network
# code). Zero-telemetry is therefore always on and not a feature toggle. There
# is intentionally no `embed-vocab` feature here.

[lints]
workspace = true

[dependencies]
arrow = { version = "59.0.0", default-features = false, features = ["ffi"] }
blake3 = "1"
calamine = { version = "0.36", optional = true, default-features = false }
memmap2 = { version = "0.9", optional = true }
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
pdf-extract = { version = "0.10", optional = true }
pulldown-cmark = "0.13.4"
quick-xml = { version = "0.41", optional = true }
rayon = { version = "1", optional = true }
regex = "1.12"
rtf-parser = { version = "0.4", optional = true }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiktoken-rs = { version = "0.12.0", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "scrub"
harness = false
