<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitVanes — Zero-Trust Local PII Purification</title>

    <!-- Primary social meta. Without these, scrapers (LinkedIn / X / Slack /
         Facebook) fall back to whatever they cached the first time they crawled
         the URL — which for this site was the old "Document Chunking for RAG"
         title from v0.1.0. Keep these in sync with Landing.tsx. -->
    <meta name="description"
      content="Zero-trust local PII purification. Detect, redact, and sanitize sensitive data across documents and streams — 100% on-premise, zero cloud leaks, zero network calls." />
    <link rel="canonical" href="https://bitvanes.com/" />

    <!-- Open Graph (LinkedIn / Facebook / Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BitVanes" />
    <meta property="og:url" content="https://bitvanes.com/" />
    <meta property="og:title" content="BitVanes — Zero-Trust Local PII Purification" />
    <meta property="og:description"
      content="Zero-trust local PII purification. Detect, redact, and sanitize sensitive data across documents and streams — 100% on-premise, zero cloud leaks, zero network calls." />
    <meta property="og:image" content="https://bitvanes.com/android-chrome-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BitVanes — Zero-Trust Local PII Purification" />
    <meta name="twitter:description"
      content="Zero-trust local PII purification. Detect, redact, and sanitize sensitive data across documents and streams — 100% on-premise, zero cloud leaks, zero network calls." />
    <meta name="twitter:image" content="https://bitvanes.com/android-chrome-512x512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
