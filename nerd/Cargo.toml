[package]
name = "bitvanes-nerd"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license-file = "../LICENSE.md"
description = "BitVanes Tier-2 NER sidecar — serves named-entity detection to the engine over a local socket. The model + ONNX Runtime live here; the engine stays ML-free."
repository = "https://github.com/BitVanes/BitVanes"
homepage = "https://bitvanes.com"
keywords = ["pii", "ner", "redaction", "privacy", "onnx"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[[bin]]
name = "bitvanes-nerd"
path = "src/main.rs"

[features]
default = []
# Real ONNX inference. Off by default — the scaffold ships an inference stub
# that fails closed (`unavailable`) so the binary builds and the wire contract
# is exercisable without the model artifact or libonnxruntime. Flip this on
# once the bundled model + ort integration land.
model = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ONNX Runtime + tokenizer, gated behind `model`. `ort` uses `load-dynamic` so
# the build stays clean — `libonnxruntime` is loaded at runtime (fail-closed if
# absent), mirroring the pdfium pattern. Set its path via `ORT_DYLIB_PATH`.
# `ndarray` (0.17, matching ort's pin) enables the TensorRef tensor API.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"], optional = true }
tokenizers = { version = "0.21", optional = true }
ndarray = { version = "0.17", optional = true }

[lints.rust]
unsafe_code = "deny"
