[package]
name = "bitvanes-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "BitVanes CLI — zero-trust local PII purification (scrub, filter, daemon)."
repository = "https://github.com/BitVanes/cli"
homepage = "https://bitvanes.com"
keywords = ["pii", "redaction", "privacy", "sanitization", "cli"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[[bin]]
name = "bitvanes"
path = "src/main.rs"

[features]
# Compile-time embedding of the built web dashboard (../../web/dist). Releases
# enable this so `bitvanes daemon` serves the dashboard with no --dashboard-dir.
default = []
dashboard = ["dep:rust-embed"]

[dependencies]
# The CLI links `bitvanes-core` via a path dependency so the three repos move
# in lockstep during development. Published release binaries are built from a
# pinned tag of this monorepo layout (core/cli/web under one parent dir).
bitvanes-core = { path = "../core/crates/core", features = ["ipc", "csv", "cli-pdf", "parallel", "office", "mmap", "stream", "config", "pdf-redact"] }
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ed25519-dalek = { version = "2", features = ["rand_core"] }
indicatif = "0.17"
rand = "0.8"
ratatui = "0.29"
rayon = "1"
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["fs"] }
walkdir = "2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
